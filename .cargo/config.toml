# Link with LLVM's lld on Windows. It ships with every Rust toolchain
# (rustlib/<host>/bin/rust-lld.exe), finds the MSVC and Windows SDK libraries
# itself, and on a four-core laptop linked the test programs about a sixth
# faster than link.exe. Linux has linked with lld by default since Rust 1.90,
# so the Docker build needs nothing here.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
