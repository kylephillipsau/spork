[workspace]
resolver = "2"
members = ["crates/invariants", "crates/policy", "crates/server"]
# The mobile shell is its own workspace: it is built by the Tauri CLI on a Mac,
# and its dependency tree has no business in the job that gates the server.
exclude = ["mobile/src-tauri"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
spork-policy = { path = "crates/policy" }
postgres = "0.19"

# **Line numbers for this workspace, nothing for its dependencies.** Full debug
# information was most of what every debug and test build spent its time on:
# generating it, then linking it into each binary. A panic or backtrace still
# names the file and the line; what goes is inspecting variables in a step
# debugger, which nothing here uses. Measured on a four-core laptop, touching
# one server file and rebuilding the tests went from 214 s to 92 s with this.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
